# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Discover the JDKs that GitHub's setup-java exports, so gametests run on the
# JDK each Minecraft version needs (17 / 21 / 25). Harmless locally.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

# Mod Properties
mod_version=1.0.1
maven_group=online.slavok
archives_base_name=simple-player-heads

# Shared, version-independent dependency versions.
# Per-Minecraft-version deps (yarn, Fabric API, ModMenu, ...) live in the build script matrix.
loader_version=0.19.3
fabric_kotlin_version=1.13.13+kotlin.2.4.10
