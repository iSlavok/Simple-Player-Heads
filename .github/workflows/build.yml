name: build
on:
  push:
    branches: [main]
  pull_request:

# Pushing a PR branch fires both push and pull_request; scope + cancel to dedupe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Yarn-mapped versions. JDK 17 and 21 are both installed so each version's
  # gametest runs on the JDK that Minecraft version requires (per-version toolchains).
  # A plain `./gradlew build` builds every declared version and runs its gametests.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: |
            17
            21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/*.jar
          if-no-files-found: error

  # Unobfuscated 26+ needs JDK 25; settings only registers those nodes on JDK 25+.
  build-unobfuscated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :26.2:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jars-unobfuscated
          path: versions/26.*/build/libs/*.jar
          if-no-files-found: error
