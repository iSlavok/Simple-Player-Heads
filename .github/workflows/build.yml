name: build
on:
  push:
    branches: [main]
  pull_request:

# Pushing a PR branch fires both push and pull_request; scope + cancel to dedupe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Yarn-mapped versions build on JDK 21 (cross-compiles 17 via `options.release`).
  # A plain `./gradlew build` builds every declared Stonecutter version.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: versions/*/build/libs/*.jar
          if-no-files-found: error
